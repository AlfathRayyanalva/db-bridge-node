app = "db-brigde-node" # Ganti dengan nama unik (huruf kecil semua)
primary_region = "sin"        # "sin" artinya region Singapura (paling dekat dengan Indonesia & Supabase)

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
